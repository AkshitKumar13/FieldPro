<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    .title{font:700 28px Arial;fill:#153b56}.section{font:700 18px Arial;fill:#153b56}.box{fill:#fff;stroke:#8aa8b8;stroke-width:2}.head{fill:#153b56}.headText{font:700 16px Arial;fill:#fff}.text{font:14px Arial;fill:#17202a}.small{font:13px Arial;fill:#5d6b78}.arrow{stroke:#087f8c;stroke-width:3;fill:none;marker-end:url(#arrow)}.side{fill:#eef5f8;stroke:#a9c5d0;stroke-width:2}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087f8c"/></marker></defs>
  <rect width="1200" height="760" fill="#f8fbfc"/>
  <text x="50" y="48" class="title">TaskForge High-Level Architecture</text>
  <text x="50" y="76" class="small">Current local POC: .NET MAUI + Shell + MVVM + SQLite</text>

  <rect x="50" y="110" width="1100" height="120" rx="8" class="box"/>
  <rect x="50" y="110" width="1100" height="34" rx="8" class="head"/>
  <text x="70" y="133" class="headText">Presentation / XAML</text>
  <rect x="75" y="160" width="190" height="48" class="side"/><text x="92" y="182" class="section">LoginPage</text><text x="92" y="200" class="small">Demo user picker</text>
  <rect x="285" y="160" width="190" height="48" class="side"/><text x="302" y="182" class="section">DashboardPage</text><text x="302" y="200" class="small">Role-aware counts</text>
  <rect x="495" y="160" width="190" height="48" class="side"/><text x="512" y="182" class="section">TasksPage</text><text x="512" y="200" class="small">Status board</text>
  <rect x="705" y="160" width="190" height="48" class="side"/><text x="722" y="182" class="section">DocumentsPage</text><text x="722" y="200" class="small">Open PDF</text>
  <rect x="915" y="160" width="210" height="48" class="side"/><text x="932" y="182" class="section">DeviceCapabilitiesPage</text><text x="932" y="200" class="small">Camera / GPS / sensor UI</text>

  <path d="M600 230 L600 270" class="arrow"/>
  <rect x="50" y="280" width="1100" height="120" rx="8" class="box"/>
  <rect x="50" y="280" width="1100" height="34" rx="8" class="head"/>
  <text x="70" y="303" class="headText">ViewModels / MVVM</text>
  <rect x="100" y="330" width="220" height="48" class="side"/><text x="118" y="352" class="section">LoginViewModel</text><text x="118" y="370" class="small">[RelayCommand]</text>
  <rect x="350" y="330" width="220" height="48" class="side"/><text x="368" y="352" class="section">DashboardViewModel</text><text x="368" y="370" class="small">Counts and navigation</text>
  <rect x="600" y="330" width="220" height="48" class="side"/><text x="618" y="352" class="section">TasksViewModel</text><text x="618" y="370" class="small">Create / assign / status</text>
  <rect x="850" y="330" width="250" height="48" class="side"/><text x="868" y="352" class="section">DeviceCapabilitiesViewModel</text><text x="868" y="370" class="small">Permission and result state</text>

  <path d="M600 400 L600 440" class="arrow"/>
  <rect x="50" y="450" width="1100" height="120" rx="8" class="box"/>
  <rect x="50" y="450" width="1100" height="34" rx="8" class="head"/>
  <text x="70" y="473" class="headText">Services / Dependency Injection</text>
  <rect x="90" y="500" width="230" height="48" class="side"/><text x="108" y="522" class="section">AuthService</text><text x="108" y="540" class="small">User lookup</text>
  <rect x="345" y="500" width="230" height="48" class="side"/><text x="363" y="522" class="section">TaskForgeDatabase</text><text x="363" y="540" class="small">SQLite data access</text>
  <rect x="600" y="500" width="230" height="48" class="side"/><text x="618" y="522" class="section">AppSession</text><text x="618" y="540" class="small">Current user state</text>
  <rect x="855" y="500" width="250" height="48" class="side"/><text x="873" y="522" class="section">DeviceCapabilitiesService</text><text x="873" y="540" class="small">Permissions and device APIs</text>

  <path d="M600 570 L600 610" class="arrow"/>
  <rect x="50" y="620" width="1100" height="90" rx="8" class="box"/>
  <rect x="50" y="620" width="1100" height="34" rx="8" class="head"/>
  <text x="70" y="643" class="headText">Storage and Platform APIs</text>
  <text x="100" y="682" class="section">taskforge.db3</text><text x="100" y="700" class="small">Users, tasks, projects, notifications, documents</text>
  <text x="470" y="682" class="section">AppDataDirectory</text><text x="470" y="700" class="small">PDFs and captured photos</text>
  <text x="790" y="682" class="section">MAUI Essentials</text><text x="790" y="700" class="small">Launcher, MediaPicker, GPS, Accelerometer, Permissions</text>
</svg>
